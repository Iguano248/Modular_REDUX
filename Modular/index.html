<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-icon {
      position: relative;
    }
    .login-icon.scanning::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid #00d4ff;
      animation: pulse-ring 1.5s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }
    .escaneando {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .escaneando span {
      width: 6px;
      height: 6px;
      background: #00d4ff;
      border-radius: 50%;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    .escaneando span:nth-child(2) { animation-delay: 0.2s; }
    .escaneando span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
    .login-methods {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }
    .login-methods button {
      flex: 1;
      padding: 10px;
      border: 2px solid #333;
      background: #1a1a2e;
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .login-methods button.active {
      border-color: #00d4ff;
      color: #00d4ff;
      background: #0d1b2a;
    }
    .pin-form {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .pin-form.visible {
      display: flex;
    }
    .pin-form input {
      padding: 12px;
      border: 2px solid #333;
      background: #1a1a2e;
      color: #fff;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
    }
    .pin-form input::placeholder {
      color: #666;
    }
    .pin-form button {
      padding: 12px;
      border: none;
      background: #00d4ff;
      color: #000;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .pin-form button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ff4444;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-icon" id="icono">🔐</div>
  <h1>Acceso</h1>

  <div class="login-methods">
    <button id="btnHuella" class="active" onclick="cambiarMetodo('huella')">🖐️ Huella</button>
    <button id="btnPin" onclick="cambiarMetodo('pin')">🔑 PIN</button>
  </div>

  <div id="huellaSection">
    <p>Coloca tu huella para iniciar sesión</p>
    <div id="mensaje" class="login-mensaje"></div>
  </div>

  <div id="pinSection" class="pin-form">
    <input type="number" id="pinId" placeholder="ID de usuario" min="1">
    <input type="password" id="pinCode" placeholder="PIN (4-8 dígitos)" maxlength="8">
    <button id="btnLoginPin" onclick="loginConPin()">Iniciar sesión</button>
    <div id="pinError" class="error-msg"></div>
  </div>

  <button onclick="volver()" class="back-btn">Volver</button>
</div>

<script>
const API = 'http://localhost:4000';
const icono = document.getElementById('icono');
const mensaje = document.getElementById('mensaje');
let ultimoEstado = null;
let metodoActual = 'huella';
let pollingInterval = null;
let procesandoSesion = false;

function cambiarMetodo(metodo) {
  metodoActual = metodo;
  procesandoSesion = false;
  document.getElementById('btnHuella').className = metodo === 'huella' ? 'active' : '';
  document.getElementById('btnPin').className = metodo === 'pin' ? 'active' : '';
  document.getElementById('huellaSection').style.display = metodo === 'huella' ? 'block' : 'none';
  document.getElementById('pinSection').className = metodo === 'pin' ? 'pin-form visible' : 'pin-form';
  document.getElementById('pinError').innerText = '';

  if (metodo === 'huella' && !pollingInterval) {
    pollingInterval = setInterval(verificarSesion, 150);
  } else if (metodo === 'pin' && pollingInterval) {
    clearInterval(pollingInterval);
    pollingInterval = null;
  }
}

async function verificarSesion() {
  if (metodoActual !== 'huella' || procesandoSesion) return;
  try {
    const [sesRes, errRes, detRes] = await Promise.all([
      fetch(API + '/session'),
      fetch(API + '/ultimo-error'),
      fetch(API + '/detectando')
    ]);

    const ses = await sesRes.json();

    if (ses && ses.pending) {
      procesandoSesion = true;
      mensaje.innerHTML = '<span class="spinner"></span> Iniciando sesión...';
      icono.className = 'login-icon';

      const loginRes = await fetch(API + '/login-session', { method: 'POST' });
      const loginData = await loginRes.json();

      if (loginData && loginData.token) {
        localStorage.setItem('sessionToken', loginData.token);
        window.location.href = "panel.html";
      } else if (loginData && loginData.pending) {
        procesandoSesion = false;
        return;
      } else {
        icono.className = 'login-icon';
        mensaje.innerText = 'Huella no registrada';
      }
      procesandoSesion = false;
      return;
    }

    const det = await detRes.json();
    const err = await errRes.json();

    if (err) {
      icono.className = 'login-icon';
      mensaje.innerText = err.mensaje;
      ultimoEstado = 'error';
    } else if (det.detectando) {
      icono.className = 'login-icon';
      mensaje.innerHTML = '<span class="spinner"></span> Huella detectada, iniciando sesión...';
      ultimoEstado = 'detectando';
    } else if (ultimoEstado !== 'esperando') {
      icono.className = 'login-icon scanning';
      mensaje.innerHTML = '<div class="escaneando">Escaneando<span></span><span></span><span></span></div>';
      ultimoEstado = 'esperando';
    }
  } catch {
    procesandoSesion = false;
    icono.className = 'login-icon';
    mensaje.innerText = 'Servidor no disponible';
    ultimoEstado = 'error';
  }
}

async function loginConPin() {
  const id = document.getElementById('pinId').value;
  const pin = document.getElementById('pinCode').value;
  const errorEl = document.getElementById('pinError');
  const btn = document.getElementById('btnLoginPin');

  errorEl.innerText = '';

  if (!id || !pin) {
    errorEl.innerText = 'Ingresa tu ID y PIN';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Iniciando sesión...';

  try {
    const res = await fetch(API + '/login-pin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: parseInt(id), pin })
    });

    const data = await res.json();

    if (data.token) {
      localStorage.setItem('sessionToken', data.token);
      window.location.href = "panel.html";
    } else {
      errorEl.innerText = data.error || 'Error al iniciar sesión';
    }
  } catch {
    errorEl.innerText = 'Servidor no disponible';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Iniciar sesión';
  }
}

document.getElementById('pinCode').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') loginConPin();
});

pollingInterval = setInterval(verificarSesion, 150);

function volver() {
  window.location.href = "home.html";
}
</script>

</body>
</html>
