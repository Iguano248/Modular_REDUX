<!DOCTYPE html>
<html>
<head>
  <title>Panel del Paciente</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="panel-wrapper">
  <div class="panel-main">
    <div class="panel-header">
      <h1>Bienvenido <span id="nombre" class="user-badge"></span></h1>
      <button onclick="logout()">Cerrar sesión</button>
    </div>

    <div class="profile-card" id="perfil"></div>

    <h2>Dieta recomendada</h2>
    <div class="diet-card" id="dieta">Cargando...</div>

    <h2>Próximas citas</h2>
    <div class="appointment-list" id="listaCitas">Cargando...</div>
  </div>

  <div class="panel-sidebar">
    <h2>Agendar cita</h2>

    <select id="medicoSelect"></select>

    <input type="date" id="calendario" required>

    <button onclick="agendarCita()" style="width:100%">Agendar</button>
    <p id="mensajeCita"></p>
  </div>
</div>

<script src="shared.js"></script>
<script src="smae.js"></script>
<script>
const API = API_BASE;
const TOKEN = localStorage.getItem('sessionToken');

if (!TOKEN) {
  window.location.href = "index.html";
}

// 🔐 Helper: petición autenticada al backend
async function fetchAuth(url, options = {}) {
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(url + sep + 'token=' + encodeURIComponent(TOKEN), options);
  if (res.status === 401) {
    if (window.__sesionExpiradaPanel) return res;
    window.__sesionExpiradaPanel = true;
    localStorage.removeItem('sessionToken');
    alert('Sesión expirada. Vuelve a iniciar sesión.');
    window.location.href = "index.html";
    throw new Error('Sesión expirada');
  }
  return res;
}

// 🔐 Usuario
async function cargarUsuario() {
  try {
    const res = await fetchAuth(API + '/session');
    const data = await res.json();
    if (!data || !data.valid) throw new Error('Sesión inválida');
    const user = data.user;

    document.getElementById('nombre').textContent = escapeHTML(user.nombre);
    document.getElementById('perfil').innerHTML =
      'Edad: ' + escapeHTML(user.edad) + '<br>' +
      'Peso: ' + escapeHTML(user.peso) + '<br>' +
      'Estatura: ' + escapeHTML(user.estatura) + '<br>' +
      'Actividad: ' + escapeHTML(user.actividad);
  } catch (err) {
    document.getElementById('perfil').textContent = 'Error al cargar perfil';
  }
}

// 🍽️ Dieta
function renderizarDietaAgrupada(plan) {
  const cont = document.getElementById('dieta');
  if (!plan) { cont.textContent = 'Sin datos'; return; }

  const comidas = [
    { key: 'desayuno', titulo: 'Desayuno' },
    { key: 'colacion1', titulo: 'Colación (Mañana)' },
    { key: 'comida', titulo: 'Comida' },
    { key: 'colacion2', titulo: 'Colación (Tarde)' },
    { key: 'cena', titulo: 'Cena' }
  ];

  let html = '';

  // PRIORIDAD 1: el menú de texto es el que guarda el nutriólogo / la IA.
  // Es el dato vigente y siempre debe mostrarse primero.
  comidas.forEach(g => {
    if (plan[g.key]) {
      html += '<h4>' + escapeHTML(g.titulo) + '</h4><p>' + escapeHTML(plan[g.key]) + '</p>';
    }
  });
  if (plan.recomendaciones) {
    html += '<h4>Recomendaciones</h4><p>' + escapeHTML(plan.recomendaciones) + '</p>';
  }
  if (html.trim()) { cont.innerHTML = html; return; }

  // PRIORIDAD 2: detalle_json SOLO como respaldo para dietas viejas
  // que no tienen los campos de texto.
  if (plan.detalle_json) {
    try {
      const detalle = typeof plan.detalle_json === 'string' ? JSON.parse(plan.detalle_json) : plan.detalle_json;
      comidas.forEach(g => {
        if (detalle[g.key] && Array.isArray(detalle[g.key]) && detalle[g.key].length > 0) {
          html += '<h4>' + escapeHTML(g.titulo) + '</h4><ul style="margin:6px 0 12px 18px;">';
          detalle[g.key].forEach(item => {
            const gramos = item.gramos ? ' - ' + escapeHTML(item.gramos) + ' g' : '';
            html += '<li>' + escapeHTML(item.alimento || '') + gramos + '</li>';
          });
          html += '</ul>';
        }
      });
    } catch (e) {}
  }
  if (plan.recomendaciones) {
    html += '<h4>Recomendaciones</h4><p>' + escapeHTML(plan.recomendaciones) + '</p>';
  }
  cont.innerHTML = html || 'Sin datos';
}

async function cargarDieta() {
  try {
    const res = await fetchAuth(API + '/dieta');
    const data = await res.json();
    if (!data || !data.plan) {
      document.getElementById('dieta').textContent = 'Sin datos';
      return;
    }
    renderizarDietaAgrupada(data.plan);
  } catch {
    document.getElementById('dieta').textContent = 'Error al cargar dieta';
  }
}

// 👨‍⚕️ Médicos
let medicos = [];

async function cargarMedicos() {
  try {
    const res = await fetch(API + '/medicos?token=' + encodeURIComponent(TOKEN));
    medicos = await res.json();
    const select = document.getElementById("medicoSelect");
    select.innerHTML = "";
    medicos.forEach(m => {
      const option = document.createElement("option");
      option.value = m.id;
      option.textContent = m.nombre;
      select.appendChild(option);
    });
    cargarFechasOcupadas();
  } catch {
    // silencioso
  }
}

// 📅 Fechas ocupadas
async function cargarFechasOcupadas() {
  const medicoId = document.getElementById("medicoSelect").value;
  try {
    const res = await fetch(API + `/citas/${medicoId}?token=` + encodeURIComponent(TOKEN));
    const fechas = await res.json();
    const calendario = document.getElementById("calendario");
    calendario.onchange = () => {
      if (fechas.includes(calendario.value)) {
        alert("Fecha no disponible");
        calendario.value = "";
      }
    };
  } catch {
    // silencioso
  }
}

// 📌 Agendar
async function agendarCita() {
  const medicoId = document.getElementById("medicoSelect").value;
  const fecha = document.getElementById("calendario").value;
  if (!fecha) {
    document.getElementById("mensajeCita").textContent = "Debes seleccionar una fecha";
    return;
  }
  try {
    const res = await fetchAuth(API + '/citas', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ medicoId, fecha })
    });
    const data = await res.json();
    document.getElementById("mensajeCita").textContent = data.mensaje;
    cargarCitas();
  } catch {
    document.getElementById("mensajeCita").textContent = "Error al agendar";
  }
}

// 📅 Mostrar citas
async function cargarCitas() {
  try {
    const res = await fetchAuth(API + '/mis-citas');
    const data = await res.json();
    if (!data.length) {
      document.getElementById('listaCitas').textContent = "No hay citas";
      return;
    }
    document.getElementById('listaCitas').innerHTML = data.map(c =>
      '<p>' + escapeHTML(c.nombre) + '<br>' + escapeHTML(c.fecha) + '</p><hr>'
    ).join('');
  } catch {
    document.getElementById('listaCitas').textContent = "Error al cargar citas";
  }
}

// 🚪 Logout
function logout() {
  fetch(API + '/logout?token=' + encodeURIComponent(TOKEN));
  localStorage.removeItem('sessionToken');
  window.location.href = "index.html";
}

// 🚀 INIT
Promise.all([
  cargarUsuario(),
  cargarMedicos(),
  cargarDieta(),
  cargarCitas()
]).catch(() => {});
</script>

</body>
</html>
